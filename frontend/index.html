  <style>
:root {
  --brand: #10B981;
  --brand-dk: #059669;
  --danger: #E5484D;
  --warn: #F5A524;

  --r-btn: 14px;
  --r-field: 12px;
  --r-tile: 14px;
  --r-box: 13px;

  --wrap: 760px;

  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B132B;
  --surface: #141C38;
  --surface2: #1B2545;
  --border: rgba(255, 255, 255, 0.10);
  --text: #F1F5F9;
  --muted: #93A3BC;
  --brand-soft: rgba(16, 185, 129, 0.14);
  --danger-soft: rgba(229, 72, 77, 0.14);
  --warn-soft: rgba(245, 165, 36, 0.14);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --code-bg: #0A1024;
  --brand-ink: #10B981;
}

html[data-theme="light"] {
  color-scheme: light;
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --surface2: #EEF2F7;
  --border: rgba(15, 23, 42, 0.10);
  --text: #0F172A;
  --muted: #5B6B80;
  --brand-soft: #D9F7EC;
  --danger-soft: #FDE8E8;
  --warn-soft: #FDF1DC;
  --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
  --code-bg: #0F172A;
  --brand-ink: #059669;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  width: 100%;

button {

}

button:active {
  opacity: 0.8;
}

@keyframes mhSpin {

@media (prefers-reduced-motion: reduce) {

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 11px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.topbar__brand {
  display: flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
  color: var(--text);
  min-width: 0;
}

.topbar__logo {
  display: flex;
  align-items: center;
}

.topbar__name {
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
}

.topbar__tools {
  margin-inline-start: auto;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.toggle {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 11px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  min-height: 40px;
  white-space: nowrap;
}

.wrap {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 18px 14px 44px;
  width: 100%;
}

.footer {
  margin-top: 30px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 12.5px;
  color: var(--muted);
}

.footer.is-hidden {
  display: none;
}

.stack     { display: grid; gap: 16px; }
.row       { display: flex; gap: 10px; }
.row--top  { margin-top: 20px; }
.grid2     { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.f14       { flex: 1.4; }

.mt14      { margin-top: 14px; }
.center    { text-align: center; }

.card {

  color: var(--muted);

}

.hint {

}

.field {

.brandname {

}

.step {

.step__n {

.step__t { font-size: 15px; font-weight: 600; color: var(--text); }

.split { display: flex; gap: 14px; align-items: flex-start; }

.icon-box {

  align-items: center;
  justify-content: center;
}

.icon-box--plain { background: var(--surface); }

.chip {
  border-radius: var(--r-pill);

  font-size: 11.5px;
  font-weight: 800;

}

.chip--ok   { background: var(--brand-soft);  color: var(--brand-ink); }
.chip--warn { background: var(--warn-soft);   color: var(--warn); }

.chip--mute { background: var(--surface2);    color: var(--muted); }

.tile {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r-tile);
  padding: 13px;
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.tile__i { font-size: 18px; flex-shrink: 0; }
.tile__b { min-width: 0; }
.tile__v {
  font-size: 14px;
  font-weight: 800;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tile__n { font-size: 11.5px; color: var(--muted); font-weight: 600; }

.score { position: relative; width: 180px; height: 180px; }
.score__mid {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score__num { font-size: 38px; font-weight: 800; color: var(--text); }
.score__lbl { font-size: 13px; font-weight: 700; color: var(--muted); }

.card--alert { background: var(--danger-soft); border-color: rgba(229, 72, 77, 0.35); }
.card--ok    { background: var(--brand-soft);  border-color: rgba(16, 185, 129, 0.35); }

.alert__head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.alert__title { font-weight: 800; font-size: 15.5px; color: var(--danger); }
.alert__item { background: var(--surface); border-radius: var(--r-box); padding: 13px; }
.alert__top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.alert__name { font-size: 14.5px; font-weight: 800; color: var(--text); flex: 1; min-width: 0; }
.alert__meta { font-size: 12.5px; color: var(--muted); line-height: 1.9; }

.ok__t { font-weight: 800; font-size: 15.5px; color: var(--brand-ink); margin-bottom: 6px; }
.ok__d { font-size: 13.5px; color: var(--muted); }

.stat { background: var(--surface2); border-radius: var(--r-box); padding: 13px; min-width: 0; }
.stat__k { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
.stat__v { font-size: 26px; font-weight: 800; line-height: 1.2; }
.stat__v--sm { font-size: 15px; line-height: 1.35; color: var(--brand-ink); }
.stat__u { font-size: 13px; font-weight: 700; margin-inline-start: 4px; }
.stat__s { margin-top: 6px; font-size: 12px; font-weight: 700; }
.stat__s--mute { color: var(--muted); }

.chart { direction: ltr; width: 100%; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }

.legend {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 14px;
  flex-wrap: wrap;
  font-size: 11.5px;
  color: var(--muted);
}
.legend__i { display: flex; align-items: center; gap: 5px; }
.legend__d { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.reco__list { min-width: 0; display: grid; gap: 12px; }
.reco__line { display: flex; gap: 9px; align-items: flex-start; }
.reco__n { color: var(--brand-ink); font-weight: 800; flex-shrink: 0; font-size: 13px; line-height: 26px; }

.req__row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px 11px;
  border-bottom: 1px solid var(--border);
  min-width: 0;
}
.req__row:last-child { border-bottom: none; }
.req__mark {
  width: 27px;
  height: 27px;
  flex-shrink: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
}
.req__mark--ok   { background: var(--brand-soft);  color: var(--brand-ink); }
.req__mark--warn { background: var(--warn-soft);   color: var(--warn); }
.req__mark--bad  { background: var(--danger-soft); color: var(--danger); }
.req__b { flex: 1; min-width: 0; }
.req__name { font-size: 14.5px; font-weight: 700; color: var(--text); }
.req__meta { font-size: 11.5px; color: var(--muted); font-weight: 600; }

.doc__head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.doc__name { font-size: 13px; font-weight: 700; color: var(--muted); flex: 1; min-width: 0; }
.docs__list { display: grid; gap: 14px; margin-top: 16px; }
.docs__title { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }

.endpoint {
  display: inline-block;
  background: var(--surface2);
  border-radius: 9px;
  padding: 7px 11px;
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--brand-ink);
  direction: ltr;
}

.code {
  margin: 0;
  padding: 16px;
  background: var(--code-bg);
  color: #8CE0BE;
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.65;
  direction: ltr;
  text-align: left;
  overflow-x: auto;
  white-space: pre;
  max-height: 440px;
}

.spinner {
  width: 54px;
  height: 54px;
  margin: 0 auto 22px;
  border-radius: 50%;
  border: 4px solid var(--border);
  border-top-color: var(--brand);
  animation: mhSpin 0.9s linear infinite;
}

.spinner--sm {
  width: 18px;
  height: 18px;
  margin: 0;
  border-width: 3px;
  display: inline-block;
  vertical-align: middle;
}

.chips-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 18px;
  flex-wrap: wrap;
}

@media (max-width: 360px) {
  .card { padding: 16px; }
  .card--hero { padding: 20px; }
  .h1 { font-size: 23px; }
  .score { width: 160px; height: 160px; }
  .score__num { font-size: 34px; }
  .mode { font-size: 12px; }
}

}

      { id: "batha",     ar: "منفذ البطحاء",   en: "Al Batha",           f: 0.85 },
      { id: "ghuwaifat", ar: "منفذ الغويفات",  en: "Al Ghuwaifat",       f: 0.50 }
    ]},
    bh: { ar: "البحرين", en: "Bahrain", passportGrace: 90, crossings: [
      { id: "kfc",       ar: "جسر الملك فهد",  en: "King Fahd Causeway", f: 1.00 }
    ]},
    kw: { ar: "الكويت", en: "Kuwait", passportGrace: 180, crossings: [
      { id: "khafji",    ar: "منفذ الخفجي",    en: "Al Khafji",          f: 0.75 },
      { id: "nuwaiseeb", ar: "منفذ النويصيب",  en: "Al Nuwaiseeb",       f: 0.60 }
    ]},
    om: { ar: "عُمان", en: "Oman", passportGrace: 180, crossings: [
      { id: "rubalkhali", ar: "منفذ الربع الخالي", en: "Empty Quarter",  f: 0.35 },
      { id: "halat",      ar: "منفذ حالة عمار",    en: "Halat Ammar",    f: 0.45 }
    ]},
    qa: { ar: "قطر", en: "Qatar", passportGrace: 90, crossings: [
      { id: "salwa",     ar: "منفذ سلوى",      en: "Salwa",              f: 0.80 },
      { id: "abusamra",  ar: "منفذ أبو سمرة",  en: "Abu Samra",          f: 0.55 }
    ]}
  };

  var MODE_FACTOR = { car: 1.0, bus: 1.15 };

  /* ============ 3. كتالوج المتطلبات ============ */

  var REQ = {
    passport:             { ar: "جواز السفر",                 en: "Passport",                 type: "date", src: "traveler", grace: "dest" },
    national_id:          { ar: "الهوية الوطنية",             en: "National ID",              type: "date", src: "traveler", grace: 30 },
    resident_id:          { ar: "هوية مقيم (الإقامة)",        en: "Residency ID (Iqama)",     type: "date", grace: 30 },
    exit_reentry:         { ar: "تأشيرة خروج وعودة",          en: "Exit and re-entry visa",   type: "date", grace: 0 },
    minor_consent:        { ar: "إذن سفر من ولي الأمر",       en: "Guardian travel consent",  type: "bool" },
    driver_license:       { ar: "رخصة القيادة",               en: "Driver licence",           type: "date", grace: 30 },
    vehicle_registration: { ar: "استمارة المركبة (الملكية)",  en: "Vehicle registration",     type: "date", grace: 30 },
    vehicle_insurance:    { ar: "تأمين المركبة",              en: "Vehicle insurance",        type: "date", grace: 0 },
    periodic_inspection:  { ar: "الفحص الدوري",               en: "Periodic inspection",      type: "date", grace: 30 },
    rental_contract:      { ar: "عقد إيجار المركبة",          en: "Car rental contract",      type: "date", grace: 0 },
    rental_permit:        { ar: "تصريح خروج من شركة التأجير", en: "Rental exit permit",       type: "date", grace: 0 },
    authorization:        { ar: "تفويض قيادة المركبة",        en: "Driving authorisation",    type: "date", grace: 0 },
    bus_ticket:           { ar: "تذكرة الحافلة",              en: "Bus ticket",               type: "bool" }
  };

  /* ============ 4. محرك تحديد المتطلبات ============ */

  function nationalityOf(id) {
    for (var i = 0; i < NATIONALITIES.length; i++) if (NATIONALITIES[i].id === id) return NATIONALITIES[i];
    return NATIONALITIES[0];
  }

  function ageAtTravel(dob, travelDate) {
    var days = daysBetween(dob, travelDate);
    return Math.floor(days / 365.25);
  }

  function determineRequirements(s) {
    var list = [];
    var nat = nationalityOf(s.nationality);
    var destName = function () { return DESTS[s.destKey] ? (isRTL() ? DESTS[s.destKey].ar : DESTS[s.destKey].en) : ""; };

    function add(key, whyAr, whyEn) {
      list.push({ key: key, because: isRTL() ? whyAr : whyEn });
    }

    if (!nat.gcc) {
      add("passport",
        "جنسيتك غير خليجية، لذلك يلزم جواز سفر ساري للعبور إلى " + destName() + ".",
        "Your nationality is non-GCC, so a valid passport is required to cross into " + destName() + ".");
      add("resident_id",
        "أنت مقيم في دول الخليج، لذلك تُطلب الإقامة سارية عند العبور.",
        "You are a GCC resident, so a valid residency ID is checked at the crossing.");
      add("exit_reentry",
        "المقيم يحتاج تأشيرة خروج وعودة سارية تغطي تاريخ السفر.",
        "Residents need an exit and re-entry visa that covers the travel date.");
    } else if (s.docType === "passport") {
      add("passport",
        "اخترت جواز السفر كوثيقة سفر، ويجب أن يبقى سارياً " + DESTS[s.destKey].passportGrace + " يوماً بعد تاريخ السفر لدخول " + destName() + ".",
        "You selected passport as your travel document; it must stay valid " + DESTS[s.destKey].passportGrace + " days beyond the travel date for " + destName() + ".");
    } else {
      add("national_id",
        "أنت مواطن خليجي ومسافر إلى دولة خليجية، لذلك تكفي الهوية الوطنية للعبور.",
        "You are a GCC citizen travelling to a GCC country, so a national ID is sufficient to cross.");
    }

    var age = ageAtTravel(s.dob, s.date);
    if (age >= 0 && age < 18) {
      add("minor_consent",
        "عمرك " + age + " سنة في تاريخ السفر (أقل من 18)، لذلك يلزم إذن سفر من ولي الأمر.",
        "You are " + age + " at the travel date (under 18), so a guardian travel consent is required.");
    }

    if (s.mode === "car") {
      add("driver_license",
        "ستسافر بسيارة خاصة، لذلك تُطلب رخصة قيادة سارية.",
        "You are travelling by private car, so a valid driver licence is required.");

      if (s.vehicleType === "rented") {
        add("rental_contract",
          "السيارة مستأجرة، لذلك يُطلب عقد الإيجار بدلاً من استمارة الملكية.",
          "The car is rented, so the rental contract replaces the ownership registration.");
        add("rental_permit",
          "شركات التأجير تشترط تصريح خروج للمركبة خارج حدود المملكة.",
          "Rental companies require an exit permit to take the vehicle across the border.");
        add("vehicle_insurance",
          "تأمين المركبة يجب أن يغطي دولة الوجهة في تاريخ السفر.",
          "Vehicle insurance must cover the destination country on the travel date.");
      } else {
        add("vehicle_registration",
          "السفر بسيارة خاصة يتطلب استمارة مركبة سارية.",
          "Travelling by private car requires a valid vehicle registration.");
        add("vehicle_insurance",
          "تأمين المركبة يجب أن يغطي دولة الوجهة في تاريخ السفر.",
          "Vehicle insurance must cover the destination country on the travel date.");
        add("periodic_inspection",
          "الفحص الدوري للمركبة مطلوب وسارٍ عند العبور البري.",
          "A valid periodic vehicle inspection is required at land crossings.");

        if (s.vehicleType === "authorized") {
          add("authorization",
            "المركبة ليست باسمك (سيارة بتفويض)، لذلك يلزم تفويض قيادة ساري.",
            "The vehicle is not registered in your name (authorised car), so a valid driving authorisation is required.");
        }
      }
    } else {
      add("bus_ticket",
        "ستسافر عبر نقل جماعي (حافلة)، لذلك لا تُطلب وثائق المركبة الخاصة، ويُطلب حجز مؤكد.",
        "You are travelling by public transport (bus), so private vehicle documents do not apply and a confirmed booking is required.");
    }

    return list;
  }

  /* ============ 5. محرك التحقق والجاهزية ============ */

  var CREDIT = { valid: 1.0, soon: 0.5, expired: 0.0, missing: 0.0 };

  function daysBetween(fromStr, toStr) {
    var a = new Date(String(fromStr) + "T00:00:00Z").getTime();
    var b = new Date(String(toStr) + "T00:00:00Z").getTime();
    if (isNaN(a) || isNaN(b)) return NaN;
    return Math.round((b - a) / 86400000);
  }

  function graceFor(def, s) {
    if (def.grace === "dest") return DESTS[s.destKey] ? DESTS[s.destKey].passportGrace : 90;
    return def.grace || 0;
  }

  function valueFor(key, s) {
    var def = REQ[key];
    if (def.src === "traveler") return s.docExpiry;
    return s.docs[key];
  }

  function evaluate(key, s) {
    var def = REQ[key];
    var v = valueFor(key, s);

    if (def.type === "bool") {
      if (v === true) {
        return { status: "valid",
          reasonAr: "مؤكد ومتوفر لهذه الرحلة.",
          reasonEn: "Confirmed and available for this trip." };
      }
      return { status: "missing",
        reasonAr: "لم تؤكد توفر هذا المتطلب بعد.",
        reasonEn: "You have not confirmed this requirement yet." };
    }

    if (!v) {
      return { status: "missing",
        reasonAr: "لم تُدخل تاريخ انتهاء هذه الوثيقة، فلا يمكن التحقق من صلاحيتها.",
        reasonEn: "No expiry date entered, so validity cannot be verified." };
    }

    var days = daysBetween(s.date, v);
    if (isNaN(days)) {
      return { status: "missing", reasonAr: "التاريخ المدخل غير صالح.", reasonEn: "The entered date is not valid." };
    }

    // قاعدة الحالة صارمة: تاريخ الانتهاء مقابل تاريخ الرحلة فقط.
    // expiry_date >= travel_date -> سارية | expiry_date < travel_date -> منتهية
    if (days < 0) {
      return { status: "expired", days: days,
        reasonAr: "انتهت في " + fmtDate(v, "ar") + "، أي قبل تاريخ السفر بـ " + Math.abs(days) + " يوماً.",
        reasonEn: "Expired on " + fmtDate(v, "en") + ", which is " + Math.abs(days) + " days before the travel date." };
    }
    return { status: "valid", days: days,
      reasonAr: "سارية حتى " + fmtDate(v, "ar") + "، أي بعد تاريخ السفر بـ " + days + " يوماً.",
      reasonEn: "Valid until " + fmtDate(v, "en") + ", which is " + days + " days after the travel date." };
  }

  function runReadiness(s) {
    var required = determineRequirements(s);
    var items = required.map(function (r) {
      var ev = evaluate(r.key, s);
      var def = REQ[r.key];
      return {
        key: r.key,
        because: r.because,
        type: def.type,
        src: def.src || null,
        grace: graceFor(def, s),
        value: valueFor(r.key, s),
        status: ev.status,
        days: ev.days,
        credit: CREDIT[ev.status],
        reason: isRTL() ? ev.reasonAr : ev.reasonEn
      };
    });

    var total = items.length;
    var met = items.reduce(function (a, i) { return a + i.credit; }, 0);
    var score = total ? Math.round((met / total) * 100) : 0;

    return {
      items: items,
      total: total,
      met: met,
      score: score,
      level: score >= 85 ? "high" : score >= 60 ? "medium" : "low",
      gaps: items.filter(function (i) { return i.status !== "valid"; }),
      entered: items.filter(function (i) { return i.status !== "missing"; }).length
    };
  }

  /* ============ 6. نموذج التنبؤ بالازدحام ============ */

  var BASE_CURVE = [16, 11, 8, 7, 10, 20, 38, 58, 64, 50, 42, 38,
                    40, 44, 50, 60, 76, 92, 104, 96, 78, 56, 34, 22];
  var DOW_FACTOR = [0.9, 0.85, 0.85, 0.95, 1.35, 1.2, 1.1];

  function predictWaitCurve(crossingF, modeF, dateStr) {
    var d = new Date(String(dateStr) + "T00:00:00Z");
    var dow = isNaN(d.getTime()) ? 2 : d.getUTCDay();
    var f = DOW_FACTOR[dow] * crossingF * modeF;
    return BASE_CURVE.map(function (v) { return Math.max(5, Math.round(v * f)); });
  }

  function waitBand(m) { return m > 60 ? "high" : m >= 25 ? "medium" : "low"; }

  function findBestWindow(curve, arrivalHour, span) {
    var lo = Math.max(0, arrivalHour - span);
    var hi = Math.min(23, arrivalHour + span);
    var best = arrivalHour;
    for (var h = lo; h <= hi; h++) if (curve[h] < curve[best]) best = h;
    var saved = curve[arrivalHour] - curve[best];
    return { hour: best, wait: curve[best], saved: saved, worthIt: saved >= 10 };
  }

  /* ============ 7. محرك التوصيات ============ */

  function buildRecommendations(d) {
    var lines = [];
    var r = d.readiness;

    if (d.apiRecommendationText) {
      lines.push(d.apiRecommendationText);
    } else if (!r.gaps.length) {
      lines.push(isRTL()
        ? "رحلتك جاهزة بنسبة " + r.score + "%. جميع المتطلبات الـ" + r.total + " المطلوبة لهذه الرحلة مكتملة."
        : "Your trip is " + r.score + "% ready. All " + r.total + " requirements for this trip are complete.");
    } else {
      lines.push(isRTL()
        ? "جاهزيتك " + r.score + "%. يوجد " + r.gaps.length + " من أصل " + r.total + " متطلباً يحتاج إلى استكمال قبل موعد السفر."
        : "You are " + r.score + "% ready. " + r.gaps.length + " of " + r.total + " requirements need attention before your travel date.");

      r.gaps.forEach(function (g) {
        var name = isRTL() ? REQ[g.key].ar : REQ[g.key].en;
        if (g.status === "expired") {
          lines.push(isRTL()
            ? "جدّد " + name + " قبل " + fmtDate(d.s.date, "ar") + "."
            : "Renew your " + name.toLowerCase() + " before " + fmtDate(d.s.date, "en") + ".");
        } else if (g.status === "soon") {
          lines.push(isRTL()
            ? "يُفضّل تجديد " + name + " لأن صلاحيتها لا تغطي المدة المطلوبة بعد السفر."
            : "Consider renewing your " + name.toLowerCase() + "; its validity does not cover the required period after travel.");
        } else {
          lines.push(isRTL()
            ? "أدخل بيانات " + name + " حتى يتمكن مُهيأ من التحقق منها."
            : "Enter your " + name.toLowerCase() + " details so Muhayya can verify it.");
        }
      });
    }

    lines.push(d.best.worthIt
      ? (isRTL()
        ? "يُفضّل الوصول إلى " + d.crossingName + " عند " + fmtHour(d.best.hour, "ar") + " بدلاً من " + fmtTime(d.s.time, "ar") + " لتوفير حوالي " + d.best.saved + " دقيقة انتظار."
        : "Arrive at " + d.crossingName + " around " + fmtHour(d.best.hour, "en") + " instead of " + fmtTime(d.s.time, "en") + " to save about " + d.best.saved + " minutes of waiting.")
      : (isRTL()
        ? "وقت وصولك " + fmtTime(d.s.time, "ar") + " مناسب عند " + d.crossingName + " — لا حاجة لتغييره."
        : "Your arrival at " + fmtTime(d.s.time, "en") + " is already good for " + d.crossingName + " — no change needed."));

    return lines;
  }

  /* ============ 8. عقد الـ API ============ */

  // خريطة مفاتيح مُهيأ الداخلية (REQ) <-> مفاتيح documents التي يتوقعها الـbackend الحقيقي.
  // عدّل هذا الكائن فقط إذا غيّر الـbackend أسماء الحقول مستقبلاً.
  var BACKEND_DOC_KEYS = {
    passport: "passport",              // جواز السفر -> passport
    vehicle_insurance: "insurance",    // تأمين المركبة -> insurance
    driver_license: "license",         // رخصة القيادة -> license
    periodic_inspection: "vehicle_inspection" // الفحص الدوري -> vehicle_inspection
  };
  // الاتجاه المعاكس، لقراءة document_status القادم من الاستجابة وربطه بمتطلبات مُهيأ الداخلية
  var BACKEND_DOC_KEYS_REV = (function () {
    var rev = {};
    Object.keys(BACKEND_DOC_KEYS).forEach(function (k) { rev[BACKEND_DOC_KEYS[k]] = k; });
    return rev;
  })();

  function apiRequestBody(d) {
    var s = d.s;

    // نبني documents بأسماء الحقول الأربعة التي يتوقعها الـFastAPI فعلاً
    // (passport / insurance / license / vehicle_inspection)، مبنية من قيم النموذج الحالية،
    // بدلاً من مفاتيح مُهيأ الداخلية (driver_license, periodic_inspection...) التي لا يعرفها الـbackend.
    var valuesByKey = {};
    d.readiness.items.forEach(function (i) {
      valuesByKey[i.key] = (i.value === undefined || i.value === "" ? null : i.value);
    });

    var docs = {
      passport: valuesByKey.passport !== undefined ? valuesByKey.passport : null,
      insurance: valuesByKey.vehicle_insurance !== undefined ? valuesByKey.vehicle_insurance : null,
      license: valuesByKey.driver_license !== undefined ? valuesByKey.driver_license : null,
      vehicle_inspection: valuesByKey.periodic_inspection !== undefined ? valuesByKey.periodic_inspection : null
    };

    // إذا اختار المستخدم جواز السفر كوثيقة سفره، تاريخ انتهائه محفوظ في document_expiry_date
    // (لأن passport من نوع src: "traveler" ولا يظهر في شاشة الوثائق المنفصلة) — نعكسه هنا صراحة.
    if (s.docType === "passport" && !docs.passport) {
      docs.passport = s.docExpiry || null;
    }

    return {
      destination: s.destKey,
      crossing: s.crossing,
      nationality: s.nationality,
      document_type: s.docType,
      document_number: s.docNumber,
      date_of_birth: s.dob,
      document_issue_date: s.docIssue,
      document_expiry_date: s.docExpiry,
      travel_date: s.date,
      arrival_time: s.time,
      travel_mode: s.mode,
      vehicle_type: s.mode === "car" ? s.vehicleType : null,
      vehicle_ownership: s.mode !== "car" ? null
        : s.vehicleType === "personal" ? "owner"
        : s.vehicleType === "rented" ? "rented" : "authorized",
      documents: docs
    };
  }

  function buildApiPayload(d) {
    var r = d.readiness;
    return {
      endpoint: "POST " + (API_BASE || "") + API_PATH,
      headers: API_HEADERS,
      request: apiRequestBody(d),
      response: {
        readiness_score: r.score,
        readiness_level: r.level,
        requirements_total: r.total,
        requirements_met: r.met,
        required_documents: r.items.map(function (i) {
          return {
            key: i.key,
            required_because: i.because,
            status: i.status,
            expires_on: i.type === "date" ? (i.value || null) : null,
            days_to_travel: (i.days === undefined ? null : i.days),
            min_validity_days_after_travel: i.type === "date" ? i.grace : null,
            credit: i.credit
          };
        }),
        missing: r.gaps.map(function (i) { return i.key; }),
        traffic: {
          crossing_id: d.s.crossing,
          travel_date: d.s.date,
          arrival_time: d.s.time,
          predicted_wait_minutes: d.nowWait,
          level: d.nowBand,
          hourly_forecast: d.curve
        },
        recommendation: {
          best_window: pad(d.best.hour) + ":00-" + pad((d.best.hour + 1) % 24) + ":00",
          predicted_wait_minutes: d.best.wait,
          time_saved_minutes: d.best.saved,
          actions: r.gaps.map(function (i) { return "resolve_" + i.key; })
        },
        source: d.s.source,
        models: { traffic: "gbdt-wait-v1", rules: "req-rules-v2" }
      }
    };
  }

  /* ============ 8b. تطبيع استجابة الـ backend الحقيقي على نموذج readiness المحلي ============ */

  // يحوّل استجابة /api/check-readiness الحقيقية إلى نفس شكل runReadiness() المحلي
  // حتى تُستخدم كل شاشات النتائج الحالية دون أي تعديل عليها.
  function normalizeApiResponse(apiData, s) {
    var localReq = determineRequirements(s); // نفس قائمة المتطلبات ونفس نص "لماذا" المحلي

    var items = localReq.map(function (r) {
      var def = REQ[r.key];
      var value = valueFor(r.key, s); // تاريخ الانتهاء الفعلي الذي أدخلته المستخدمة (من state مباشرة)

      // حالة الوثيقة (سارية / منتهية / ناقصة) تُحدَّد حصراً من expiry_date مقابل travel_date،
      // بنفس منطق evaluate() المستخدم في خطوة 4/4 — بغض النظر عن نص document_status القادم من الـbackend.
      // الـmapping بين أسماء الوثائق (BACKEND_DOC_KEYS) يُستخدم فقط في apiRequestBody() لتحديد
      // "أي وثيقة" نتحدث عنها عند الإرسال، وليس لتحديد حالتها هنا.
      var ev = evaluate(r.key, s);
      var status = ev.status;

      return {
        key: r.key,
        because: r.because,
        type: def.type,
        src: def.src || null,
        grace: graceFor(def, s),
        value: value,
        status: status,
        days: (def.type === "date" && value) ? daysBetween(s.date, value) : undefined,
        credit: CREDIT[status] !== undefined ? CREDIT[status] : 0,
        reason: ev[isRTL() ? "reasonAr" : "reasonEn"]
      };
    });

    var total = (typeof apiData.requirements_total === "number") ? apiData.requirements_total : items.length;
    var met = (typeof apiData.requirements_met === "number") ? apiData.requirements_met : items.filter(function (i) { return i.status === "valid"; }).length;
    var score = (typeof apiData.readiness_score === "number") ? apiData.readiness_score : (total ? Math.round((met / total) * 100) : 0);
    var level = apiData.readiness_level || (score >= 85 ? "high" : score >= 60 ? "medium" : "low");

    return {
      items: items,
      total: total,
      met: met,
      score: score,
      level: level,
      gaps: items.filter(function (i) { return i.status !== "valid"; }),
      entered: items.filter(function (i) { return i.status !== "missing"; }).length
    };
  }

  /* ============ 9. النصوص ============ */

  var T = {

  /* ============ 10. الحالة والمساعدات ============ */

  var M_AR = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  var M_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function pad(n) { return String(n).length < 2 ? "0" + n : String(n); }

  function esc(v) {
    return String(v === null || v === undefined ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function fmtDate(v, lang) {
    var p = String(v || "").split("-");
    if (p.length !== 3) return v || "";
    var names = lang === "ar" ? M_AR : M_EN;
    return parseInt(p[2], 10) + " " + (names[parseInt(p[1], 10) - 1] || p[1]) + " " + p[0];
  }

  function fmtHour(h, lang) {
    var hh = ((h % 24) + 24) % 24;
    var pm = hh >= 12, h12 = hh % 12;
    if (h12 === 0) h12 = 12;
    return h12 + ":00 " + (lang === "ar" ? (pm ? "م" : "ص") : (pm ? "PM" : "AM"));
  }

  function fmtTime(v, lang) {
    var p = String(v || "").split(":");
    if (p.length < 2) return v || "";
    var h = parseInt(p[0], 10), pm = h >= 12, h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return h12 + ":" + p[1] + " " + (lang === "ar" ? (pm ? "مساءً" : "صباحًا") : (pm ? "PM" : "AM"));
  }

  var state = {
    lang: "ar",
    theme: "dark",
    screen: "home",

    nationality: "sa",

    openReq: null,
    source: "local",

    // نتيجة الـbackend الحقيقي (تبقى null حتى ينجح نداء API)
    apiResult: null,
    apiError: null,
    isChecking: false
  };

  var checkTimer = null;

  function t(k) { return (T[state.lang] && T[state.lang][k]) || k; }
  function isRTL() { return state.lang === "ar"; }
  function L(o) { return isRTL() ? o.ar : o.en; }

  function currentCrossing() {
    var list = DESTS[state.destKey].crossings;
    for (var i = 0; i < list.length; i++) if (list[i].id === state.crossing) return list[i];
    return list[0];
  }

  function compute() {
    var cr = currentCrossing();

    // إذا توفرت نتيجة من الـbackend الحقيقي نستخدمها كمصدر أساسي للـtraffic أيضاً،
    // وإلا نستخدم نموذج التنبؤ المحلي كما كان.
    var curve, arrHour, nowWait, nowBand, best, peakHour;
    arrHour = Math.min(23, Math.max(0, parseInt(String(state.time).split(":")[0], 10) || 0));

    var api = state.apiResult;

    if (api && Array.isArray(api.hourly_forecast) && api.hourly_forecast.length === 24) {
      curve = api.hourly_forecast;
    } else {
      curve = predictWaitCurve(cr.f, MODE_FACTOR[state.mode] || 1, state.date);
    }

    if (api && typeof api.expected_wait_minutes === "number") {
      nowWait = api.expected_wait_minutes;
    } else {
      nowWait = curve[arrHour];
    }

    nowBand = (api && api.traffic_level) ? api.traffic_level : waitBand(nowWait);
    best = findBestWindow(curve, arrHour, 5);

    // إن أرسل الـbackend وقتاً موصى به كنص (مثال "18:00")، نحوله لساعة لعرضه في نفس مكوّن best window
    if (api && typeof api.recommended_time === "string") {
      var rh = parseInt(api.recommended_time.split(":")[0], 10);
      if (!isNaN(rh)) {
        best = {
          hour: rh,
          wait: curve[Math.min(23, Math.max(0, rh))],
          saved: Math.max(0, nowWait - curve[Math.min(23, Math.max(0, rh))]),
          worthIt: rh !== arrHour
        };
      }
    }

    peakHour = curve.indexOf(Math.max.apply(null, curve));

    var readiness = api ? normalizeApiResponse(api, state) : runReadiness(state);

    var d = {
      s: state,
      readiness: readiness,
      curve: curve,
      arrHour: arrHour,
      nowWait: nowWait,
      nowBand: nowBand,
      best: best,
      peakHour: peakHour,
      destName: L(DESTS[state.destKey]),
      crossingName: L(cr),
      apiRecommendationText: (api && api.recommendation) ? api.recommendation : null
    };
    d.api = buildApiPayload(d);
    return d;
  }

      var def = REQ[i.key];
      var name = L(def);

        body = '<div class="ref">' +

          '<circle cx="90" cy="90" r="' + RAD + '" fill="none" stroke="' + color + '" stroke-width="13" ' +
            'stroke-linecap="round" stroke-dasharray="' + CIRC.toFixed(2) + '" ' +

        '</svg>' +

  };

  function chartSvg(d) {
    var CW = 300, CH = 104;
    var col = d.nowBand === "high" ? "#E5484D" : d.nowBand === "medium" ? "#F5A524" : "#10B981";
    var maxW = Math.max.apply(null, d.curve);

    var pts = d.curve.map(function (v, i) {
      return { x: (i / 23) * CW, y: CH - (v / maxW) * (CH - 10) - 4 };
    });
    var lineD = pts.map(function (p, i) { return (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); }).join(" ");
    var areaD = lineD + " L " + CW + " " + CH + " L 0 " + CH + " Z";
    var ticks = [0, 4, 8, 12, 16, 20].map(function (h) {
      return '<text x="' + ((h / 23) * CW).toFixed(1) + '" y="' + (CH + 14) + '" font-size="8.5" ' +
             'fill="var(--muted)" text-anchor="middle" font-weight="600">' + pad(h) + '</text>';
    }).join("");

    return '<div class="chart"><svg viewBox="0 0 ' + CW + ' ' + (CH + 20) + '" aria-label="' + esc(t("trafficSub")) + '">' +
      '<defs><linearGradient id="mhFill" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="' + col + '" stop-opacity="0.38"/>' +
        '<stop offset="100%" stop-color="' + col + '" stop-opacity="0.02"/>' +
      '</linearGradient></defs>' +
      '<path d="' + areaD + '" fill="url(#mhFill)"/>' +
      '<path d="' + lineD + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<line x1="' + pts[d.arrHour].x.toFixed(1) + '" y1="0" x2="' + pts[d.arrHour].x.toFixed(1) + '" y2="' + CH + '" ' +
        'stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<circle cx="' + pts[d.best.hour].x.toFixed(1) + '" cy="' + pts[d.best.hour].y.toFixed(1) + '" r="4.5" ' +
        'fill="#10B981" stroke="var(--surface)" stroke-width="2"/>' +
      '<circle cx="' + pts[d.arrHour].x.toFixed(1) + '" cy="' + pts[d.arrHour].y.toFixed(1) + '" r="4.5" ' +
        'fill="' + col + '" stroke="var(--surface)" stroke-width="2"/>' +
      ticks +
    '</svg></div>';
  }

  S.requirements = function (d) {

    var inputs = [
      [t("nationality"),  L(nat)],
      [t("destination"),  d.destName],
      [t("docType"),      state.docType === "passport" ? t("docPassport") : t("docNational")],
      [t("tripDate"),     fmtDate(state.date, state.lang)],
      [t("travelMode"),   state.mode === "car" ? t("modeCar") : t("modeBus")],
      [t("vehicleType"),  state.mode === "car"
        ? (state.vehicleType === "personal" ? t("vPersonal") : state.vehicleType === "rented" ? t("vRented") : t("vAuthorized"))
        : t("busCoach")]
    ].map(function (p) {
      return '<div class="kv"><span class="kv__k">' + esc(p[0]) + '</span><span class="kv__v">' + esc(p[1]) + '</span></div>';
    }).join("");

    var rules = d.readiness.items.map(function (i, n) {
      return '<div class="rule">' +
        '<div class="rule__head"><span class="step__n">' + (n + 1) + '</span>' +
          '<span class="rule__name">' + esc(L(REQ[i.key])) + '</span>' +
          chip(statusTone(i.status), t(i.status)) + '</div>' +
        '<p class="p p--xs" style="margin-top:8px">' + esc(i.because) + '</p>' +
      '</div>';
    }).join("");

    return '<div class="stack">' +
      '<div class="card">' +
        '<h1 class="h1 h1--sm" style="margin-bottom:8px">' + esc(t("rulesTitle")) + '</h1>' +
        '<p class="p">' + esc(t("rulesDesc")) + '</p>' +
      '</div>' +
      '<div class="card">' +
        '<h2 class="h2 h2--xs" style="margin-bottom:12px">' + esc(t("inputs")) + '</h2>' + inputs +
      '</div>' +
      '<div class="card">' + rules + '</div>' +
      '<button class="btn btn--brand" data-act="go" data-go="api">' + esc(t("viewApi")) + '</button>' +
      '<div class="row">' +
        '<button class="btn btn--ghost f1" data-act="go" data-go="reco">' + esc(t("back")) + '</button>' +
        '<button class="btn btn--primary f14" data-act="go" data-go="traveler">' + esc(t("newCheck")) + '</button>' +
      '</div>' +
    '</div>';
  };

  S.api = function (d) {
    var headers = Object.keys(API_HEADERS).map(function (k) {
      return k + ": " + API_HEADERS[k];
    }).join("\n");

    return '<div class="stack">' +
      '<div class="card">' +
        '<h1 class="h1 h1--sm" style="margin-bottom:8px">' + esc(t("apiTitle")) + '</h1>' +
        '<div class="endpoint">' + esc(d.api.endpoint) + '</div>' +
        '<pre class="code code--sm">' + esc(headers) + '</pre>' +
        '<p class="p p--xs" style="margin-top:12px">' + esc(t("apiNote")) + '</p>' +
      '</div>' +
      '<div class="card card--flush">' +
        '<div class="code__k">' + esc(t("requestBody")) + '</div>' +
        '<pre class="code">' + esc(JSON.stringify(d.api.request, null, 2)) + '</pre>' +
      '</div>' +
      '<div class="card card--flush">' +
        '<div class="code__k">' + esc(t("responseBody")) + '</div>' +
        '<pre class="code">' + esc(JSON.stringify(state.apiResult || d.api.response, null, 2)) + '</pre>' +
      '</div>' +
      '<div class="row">' +
        '<button class="btn btn--ghost f1" data-act="go" data-go="requirements">' + esc(t("back")) + '</button>' +
        '<button class="btn btn--primary f14" data-act="go" data-go="home">' + esc(t("home")) + '</button>' +
      '</div>' +
    '</div>';
  };

  /* ============ 12. العرض والأحداث ============ */

  var app = document.getElementById("app");
  var footer = document.getElementById("footer");
  var brandLogo = document.getElementById("brandLogo");
  var themeBtn = document.getElementById("themeBtn");
  var langBtn = document.getElementById("langBtn");

  function render() {
    var root = document.documentElement;
    root.setAttribute("lang", state.lang);
    root.setAttribute("dir", isRTL() ? "rtl" : "ltr");
    root.setAttribute("data-theme", state.theme);

    if (brandLogo) brandLogo.innerHTML = ICON.logo(26);
    if (themeBtn) { themeBtn.textContent = state.theme === "dark" ? "🌙" : "☀️"; themeBtn.setAttribute("aria-label", t("theme")); }
    if (langBtn) { langBtn.textContent = isRTL() ? "EN" : "ع"; langBtn.setAttribute("aria-label", t("language")); }

    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });

    var d = compute();
    app.innerHTML = (S[state.screen] || S.home)(d);
    if (footer) footer.className = "footer" + (state.screen === "checking" ? " is-hidden" : "");
  }

  function go(next) {
    state.screen = next;
    render();
    if (window.scrollTo) window.scrollTo(0, 0);
  }

  function finishCheck(source, apiData, errorMsg) {
    state.isChecking = false;
    state.source = source;
    state.openReq = null;

    if (source === "server" && apiData) {
      state.apiResult = apiData;
      state.apiError = null;
      go("result");
    } else if (errorMsg) {
      // فشل الاتصال: لا نعرض أي نتيجة (محلية أو مزيفة) على أنها نتيجة الخادم.
      state.apiResult = null;
      state.apiError = errorMsg;
      go("checkError");
    } else {
      // لا يوجد API_BASE مُعرّف: نستخدم المحرك المحلي بوضوح كمصدر محلي (سلوك تراجعي فقط).
      state.apiResult = null;
      state.apiError = null;
      go("result");
    }
  }

  function runCheck() {
    state.isChecking = true;
    state.apiError = null;
    go("checking");
    if (checkTimer) clearTimeout(checkTimer);

    if (!API_BASE) {
      checkTimer = setTimeout(function () { finishCheck("local"); }, 1100);
      return;
    }

    var body = apiRequestBody(compute());

    fetch(API_BASE + API_PATH, {
      method: "POST",
      headers: API_HEADERS,
      body: JSON.stringify(body)
    })
      .then(function (res) {
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        return res.json();
      })
      .then(function (json) {
        finishCheck("server", json, null);
      })
      .catch(function (err) {
        finishCheck("server", null, (t("apiErrorDesc")) + (err && err.message ? " (" + err.message + ")" : ""));
      });
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act");

    if (act === "go") {
      go(el.getAttribute("data-go"));

    } else if (act === "theme") {
      state.theme = state.theme === "dark" ? "light" : "dark";
      render();

    } else if (act === "lang") {
      state.lang = isRTL() ? "en" : "ar";
      render();

    } else if (act === "check") {
      if (state.isChecking) return;
      runCheck();

    } else if (act === "toggleReq") {
      var k = el.getAttribute("data-req");
      state.openReq = state.openReq === k ? null : k;
      render();

    } else if (act === "set") {
      var f = el.getAttribute("data-field");
      var v = el.getAttribute("data-value");

      if (f.indexOf("doc:") === 0) {
        state.docs[f.slice(4)] = (v === "yes");
      } else if (f === "mode") {
        state.mode = v;
      } else if (f === "vehicleType") {
        state.vehicleType = v;
      } else if (f === "busType") {
        state.busType = v;
      } else if (f === "docType") {
        state.docType = v;
      }
      render();
    }
  });

  document.addEventListener("change", function (e) {
    var el = e.target.closest ? e.target.closest("[data-field]") : null;
    if (!el || el.tagName === "BUTTON") return;
    var f = el.getAttribute("data-field");

    if (f === "doc") {
      state.docs[el.getAttribute("data-key")] = el.value;
    } else if (f === "destKey") {
      state.destKey = el.value;
      state.crossing = DESTS[state.destKey].crossings[0].id;
    } else if (f === "nationality") {
      state.nationality = el.value;
      if (!nationalityOf(state.nationality).gcc) state.docType = "passport";
    } else if (f in state) {
      state[f] = el.value;
    }
    render();
  });

  render();
})();
  </script>
</body>
</html>
